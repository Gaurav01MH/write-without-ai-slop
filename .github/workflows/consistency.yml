name: Consistency

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check versions, links and test counts
        run: python3 scripts/check_consistency.py
      - name: Compile the scripts
        run: python3 -m py_compile scripts/check_text.py scripts/check_consistency.py evals/grade.py evals/make_prompts.py
