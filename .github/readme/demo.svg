inite}@keyframes d3{0%,26.00%{stroke-dashoffset:1;opacity:0}26.01%{opacity:1}29.50%,100%{stroke-dashoffset:0;opacity:1}}@keyframes f3{0%,28.50%{opacity:0}31.00%,100%{opacity:1}}.d3{stroke-dasharray:1;stroke-dashoffset:0;animation:d3 20.0s linear infinite}.f3{animation:f3 20.0s linear infinite}@keyframes d4{0%,37.00%{stroke-dashoffset:1;opacity:0}37.01%{opacity:1}40.50%,100%{stroke-dashoffset:0;opacity:1}}@keyframes f4{0%,39.50%{opacity:0}42.00%,100%{opacity:1}}.d4{stroke-dasharray:1;stroke-dashoffset:0;animation:d4 20.0s linear infinite}.f4{animation:f4 20.0s linear infinite}@keyframes aft{0%,49.00%{opacity:0}53.00%,100%{opacity:1}}.aft{animation:aft 20.0s linear infinite}@keyframes foot{0%,55.00%{opacity:0}59.00%,100%{opacity:1}}.foot{animation:foot 20.0s linear infinite}@keyframes all{0%,93%{opacity:1}97%,100%{opacity:0}}.all{animation:all 20.0s linear infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="all"><rect x="1" y="1" width="638" height="646" rx="14" fill="#fbf7ee" stroke="#e4dcc8" stroke-width="2"/><text class="lab" x="28" y="40">BEFORE</text><rect x="80.0" y="172" width="25.6" height="22" rx="3" fill="#ffe27a" opacity=".75"/><rect x="144.8" y="172" width="14.8" height="22" rx="3" fill="#ffe27a" opacity=".75"/><text class="d" x="28" y="76" textLength="518.4" lengthAdjust="spacingAndGlyphs">Here's the thing: shipping fast isn't just about</text><text class="d" x="28" y="104" textLength="259.2" lengthAdjust="spacingAndGlyphs">speed, it's about trust.</text><text class="d" x="28" y="160" textLength="518.4" lengthAdjust="spacingAndGlyphs">Last month our team cut the checkout bug backlog</text><text class="d" x="28" y="188" textLength="486.0" lengthAdjust="spacingAndGlyphs">from 42 to 9 in two weeks. Not just a win for</text><text class="d" x="28" y="216" textLength="486.0" lengthAdjust="spacingAndGlyphs">engineering, but a win for customers, for the</text><text class="d" x="28" y="244" textLength="313.2" lengthAdjust="spacingAndGlyphs">business, and for the future.</text><text class="d" x="28" y="300" textLength="367.2" lengthAdjust="spacingAndGlyphs">Agree? What's your biggest lesson?</text><path class="pen d1" pathLength="1" d="M25.0,70.1 Q36.9,67.5 48.7,69.9 Q62.5,67.3 76.2,71.2 Q91.8,72.7 107.5,69.5 Q122.7,68.9 137.9,70.8 Q153.3,68.2 168.7,69.1 Q182.3,68.1 195.9,69.6 Q205.3,70.8 214.6,71.3"/><path class="pen d2" pathLength="1" d="M370.6,69.4 Q385.1,68.7 399.6,70.5 Q411.7,68.3 423.9,71.3 Q440.7,67.4 457.5,69.1 Q474.0,67.5 490.6,70.8 Q504.4,69.2 518.2,69.9 Q533.2,69.0 548.1,70.4 Q548.8,69.4 549.4,69.2"/><path class="pen d2" pathLength="1" d="M25.0,98.1 Q36.9,95.3 48.8,98.1 Q63.5,98.7 78.2,98.1 Q90.2,100.3 102.2,98.7 Q117.5,97.3 132.8,97.2 Q147.4,95.8 162.0,98.9 Q175.4,99.1 188.7,98.3 Q201.6,97.7 214.6,98.0"/><path class="pen d3" pathLength="1" d="M316.6,181.8 Q333.5,184.3 350.3,183.0 Q364.1,179.7 377.8,180.8 Q393.1,180.3 408.5,182.9 Q423.9,179.1 439.3,181.2 Q451.6,179.6 463.8,181.0 Q475.3,182.1 486.8,181.1 Q501.4,181.5 516.0,182.7 Q516.5,183.3 517.0,181.8"/><path class="pen d3" pathLength="1" d="M25.0,210.2 Q41.8,210.8 58.5,209.7 Q74.8,209.8 91.0,210.1 Q106.4,208.6 121.8,209.1 Q134.1,210.4 146.5,208.9 Q159.5,210.6 172.5,210.8 Q187.7,212.0 203.0,209.3 Q218.9,209.5 234.7,211.2 Q245.8,209.1 256.9,211.4 Q268.9,208.2 280.9,211.0 Q297.3,207.2 313.7,210.5 Q325.4,211.8 337.1,210.1 Q352.0,210.8 366.9,211.2 Q379.9,213.0 392.9,209.1 Q407.8,210.1 422.6,208.7 Q438.8,209.3 455.0,209.0 Q469.5,208.0 484.0,210.3 Q497.3,207.5 510.7,209.0 Q513.8,207.1 517.0,210.9"/><path class="pen d3" pathLength="1" d="M25.0,237.7 Q41.3,236.0 57.5,237.8 Q70.6,237.3 83.7,237.9 Q99.5,240.3 115.2,239.2 Q131.9,236.4 148.6,239.4 Q161.5,238.7 174.4,239.3 Q190.0,239.9 205.6,238.1 Q218.6,236.5 231.6,239.2 Q243.6,241.0 255.6,238.3 Q268.7,235.7 281.8,238.9 Q297.3,239.6 312.8,239.1 Q324.7,240.9 336.5,239.3 Q340.4,239.4 344.2,237.7"/><path class="pen d4" pathLength="1" d="M25.0,294.4 Q40.3,295.5 55.5,293.4 Q71.9,293.9 88.3