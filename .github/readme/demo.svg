lass="d ok" x="28" y="520" textLength="518.4" lengthAdjust="spacingAndGlyphs">Last month our team cut the checkout bug backlog</text><text class="d ok" x="28" y="548" textLength="280.8" lengthAdjust="spacingAndGlyphs">from 42 to 9 in two weeks.</text></g><g class="foot"><text class="foot2" x="28" y="592">The numbers stayed. Four patterns went.</text><text x="28" y="622" style="font-size:14px;fill:#6b6350" textLength="403.2" lengthAdjust="spacingAndGlyphs">npx skills add nocodeanish/write-without-ai-slop</text></g></g></svg>
