0;letter-spacing:.14em;fill:#8a8068">BEFORE</text><g class="aft"><text class="sans" x="330" y="42" style="font-size:12px;font-weight:700;letter-spacing:.14em;fill:#1d6b3a">AFTER</text></g><rect x="211.7" y="145" width="17.4" height="16" rx="2.5" fill="#ffe27a" opacity=".85"/><rect x="24.5" y="164" width="10.2" height="16" rx="2.5" fill="#ffe27a" opacity=".85"/><text class="ink" x="26" y="62" style="font-size:12px" textLength="223.2" lengthAdjust="spacingAndGlyphs">Here's the thing: shipping fast</text><text class="ink" x="26" y="81" style="font-size:12px" textLength="201.6" lengthAdjust="spacingAndGlyphs">isn't just about speed, it's</text><text class="ink" x="26" y="100" style="font-size:12px" textLength="86.4" lengthAdjust="spacingAndGlyphs">about trust.</text><text class="ink" x="26" y="138" style="font-size:12px" textLength="194.4" lengthAdjust="spacingAndGlyphs">Last month our team cut the</text><text class="ink" x="26" y="157" style="font-size:12px" textLength="223.2" lengthAdjust="spacingAndGlyphs">checkout bug backlog from 42 to</text><text class="ink" x="26" y="176" style="font-size:12px" textLength="216.0" lengthAdjust="spacingAndGlyphs">9 in two weeks. Not just a win</text><text class="ink" x="26" y="195" style="font-size:12px" textLength="216.0" lengthAdjust="spacingAndGlyphs">for engineering, but a win for</text><text class="ink" x="26" y="214" style="font-size:12px" textLength="230.4" lengthAdjust="spacingAndGlyphs">customers, for the business, and</text><text class="ink" x="26" y="233" style="font-size:12px" textLength="108.0" lengthAdjust="spacingAndGlyphs">for the future.</text><text class="ink" x="26" y="271" style="font-size:12px" textLength="244.8" lengthAdjust="spacingAndGlyphs">Agree? What's your biggest lesson?</text><path class="pen s0" pathLength="1" d="M24.0,57.8 Q38.6,58.5 53.2,57.1 Q66.2,57.6 79.3,57.6 Q90.3,55.8 101.3,57.3 Q114.4,55.6 127.5,59.0 Q138.9,58.0 150.4,58.0"/><path class="pen s1" pathLength="1" d="M24.0,76.5 Q37.4,79.8 50.8,75