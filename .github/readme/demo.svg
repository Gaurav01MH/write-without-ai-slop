spacingAndGlyphs">checkout bug backlog from 42 to</text><text class="ink ok" x="330" y="138" style="font-size:12px" textLength="108.0" lengthAdjust="spacingAndGlyphs">9 in two weeks.</text></g><g class="cn"><circle cx="366" cy="258" r="17" fill="#ffcf4a" stroke="#c98a14" stroke-width="2.5"/><circle cx="366" cy="258" r="11" fill="none" stroke="#e6a92c" stroke-width="1.6"/><text x="366" y="263" style="font-size:14px;font-weight:800;fill:#7a4a05;text-anchor:middle">42</text><circle cx="412" cy="258" r="17" fill="#ffcf4a" stroke="#c98a14" stroke-width="2.5"/><circle cx="412" cy="258" r="11" fill="none" stroke="#e6a92c" stroke-width="1.6"/><text x="412" y="263" style="font-size:14px;font-weight:800;fill:#7a4a05;text-anchor:middle">9</text><g transform="translate(530 242)" shape-rendering="crispEdges"><rect x="30" y="0" width="5" height="5" fill="#4fd18b"/><rect x="25" y="5" width="10" height="5" fill="#4fd18b"/><rect x="0" y="10" width="5" height="5" fill="#4fd18b"/><rect x="20" y="10" width="10" height="5" fill="#4fd18b"/><rect x="0" y="15" width="10" height="5" fill="#4fd18b"/><rect x="15" y="15" width="10" height="5" fill="#4fd18b"/><rect x="5" y="20" width="15" height="5" fill="#4fd18b"/><rect x="10" y="25" width="5" height="5" fill="#4fd18b"/></g></g><text style="font-size:11px;fill:#8d95b3" x="300.0" y="328" text-anchor="middle" textLength="317" lengthAdjust="spacingAndGlyphs">npx skills add nocodeanish/write-without-ai-slop</text></g></g><rect x="1" y="1" width="598" height="334" rx="18" fill="none" stroke="#2a3558" stroke-width="2"/></svg>
