ate(1110px,0);opacity:0}100.00%{transform:translate(1110px,0);opacity:0}}.tok{animation:tok 16.0s linear infinite;}@keyframes reset{0.00%{opacity:0}1.88%{opacity:1}92.50%{opacity:1}97.50%{opacity:0}100.00%{opacity:0}}.reset{animation:reset 16.0s linear infinite;}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="1" y="1" width="1198" height="328" rx="18" fill="#17161d" stroke="#363343" stroke-width="2"/><g class="reset"><text class="lab" x="40" y="46">WRITE MODE, END TO END</text><rect class="tile" x="50" y="90" width="200" height="140" rx="16"/><rect class="on0" x="50" y="90" width="200" height="140" rx="16" fill="none" stroke="#d6342b" stroke-width="3"/><text class="head" x="150" y="264" style="font-size:22px;text-anchor:middle" textLength="65" lengthAdjust="spacingAndGlyphs">Write</text><text class="sans dim" x="150" y="290" style="font-size:14px;text-anchor:middle" textLength="195" lengthAdjust="spacingAndGlyphs">follows the rules as it writes</text><path d="M262,160 L336,160" stroke="#363343" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round" fill="none"/><path d="M328,152 L340,160 L328,168" stroke="#363343" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect class="tile" x="350" y="90" width="200" height="140" rx="16"/><rect class="on1" x="350" y="90" width="200" height="140" rx="16" fill="none" stroke="#d6342b" stroke-width="3"/><text class="head" x="450" y="264" style="font-size:22px;text-anchor:middle" textLength="65" lengthAdjust="spacingAndGlyphs">Check</text><text class="sans dim" x="450" y="290" style="font-size:14px;text-anchor:middle" textLength="240" lengthAdjust="spacingAndGlyphs">runs the final check on its own draft</text><path d="M562,160 L636,160" stroke="#363343" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round" fill="none"/><path d="M628,152 L640,160 L628,168" stroke="#363343" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><re