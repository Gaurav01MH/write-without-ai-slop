<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="Write mode from start to end: the agent writes with the rules in mind, checks its own draft, makes the smallest edit that removes any problem, and hands back only the text."><title>Write mode from start to end: the agent writes with the rules in mind, checks its own draft, makes the smallest edit that removes any problem, and hands back only the text.</title><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace;font-size:15px;fill:#f3ecdc;white-space:pre}.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}.dim{fill:#9a94a8}.ink{fill:#2a2a2a}.green{fill:#4fd18b}.red{fill:#d6342b}.lab{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;letter-spacing:.16em;fill:#9a94a8}.head{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-weight:800;fill:#f3ecdc}.serif{font-family:Georgia,"Times New Roman",serif;font-style:italic;fill:#d6342b}.pen{fill:none;stroke:#d6342b;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.strike{fill:none;stroke:#d6342b;stroke-width:2;stroke-linecap:round}.tile{fill:#23212c;stroke:#363343;stroke-width:1.5}.big{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace;font-size:54px;font-weight:700}@keyframes on0{0.00%{opacity:0}10.00%{opacity:0}11.88%{opacity:1}23.75%{opacity:1}25.63%{opacity:0}100.00%{opacity:0}}.on0{animation:on0 16.0s linear infinite;}@keyframes on1{0.00%{opacity:0}30.00%{opacity:0}31.87%{opacity:1}43.75%{opacity:1}45.62%{opacity:0}100.00%{opacity:0}}.on1{animation:on1 16.0s linear infinite;}@keyframes on2{0.00%{opacity:0}51.25%{opacity:0}53.12%{opacity:1}65.00%{opacity:1}66.88%{opacity:0}100.00%{opacity:0}}.on2{animation:on2 16.0s linear infinite;}@keyframes on3{0.00%{opacity:0}72.5