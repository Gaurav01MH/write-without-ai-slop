text class="ink" x="281" y="158" style="font-size:16px" textLength="125" lengthAdjust="spacingAndGlyphs">Bugs: 42 down</text><text class="ink" x="281" y="182" style="font-size:16px" textLength="48" lengthAdjust="spacingAndGlyphs">to 9.</text><rect x="281" y="214" width="110" height="9" rx="4.5" fill="#2a2a2a" opacity=".22"/><rect x="281" y="238" width="150" height="9" rx="4.5" fill="#2a2a2a" opacity=".22"/></g></g><g class="k2"><rect x="495" y="116" width="210" height="170" rx="12" fill="#fbf7ee" stroke="#e4dcc8" stroke-width="2"/><g class="b1"><text class="ink" x="513" y="158" style="font-size:16px" textLength="163" lengthAdjust="spacingAndGlyphs">Here's the thing:</text><path class="strike" d="M509.0,152.0 Q525.8,153.7 542.6,151.6 Q556.8,154.8 571.1,150.9 Q585.4,152.9 599.7,150.7 Q613.5,150.3 627.4,151.0 Q639.5,154.9 651.7,152.5 Q662.9,152.3 674.1,153.0 Q677.2,154.7 680.2,151.7"/><rect x="513" y="182" width="150" height="9" rx="4.5" fill="#2a2a2a" opacity=".22"/><rect x="513" y="206" width="150" height="9" rx="4.5" fill="#2a2a2a" opacity=".22"/><rect x="513" y="230" width="112" height="9" rx="4.5" fill="#2a2a2a" opacity=".22"/></g><g class="a1"><text class="ink" x="513" y="158" style="font-size:16px" textLength="154" lengthAdjust="spacingAndGlyphs">A support ticket</text><text class="ink" x="513" y="182" style="font-size:16px" textLength="163" lengthAdjust="spacingAndGlyphs">changed our plan.</text><rect x="513" y="214" width="140" height="9" rx="4.5" fill="#2a2a2a" opacity=".22"/><rect x="513" y="238" width="100" height="9" rx="4.5" fill="#2a2a2a" opacity=".22"/></g></g><g class="k3"><rect x="727" y="116" width="210" height="170" rx="12" fill="#fbf7ee" stroke="#e4dcc8" stroke-width="2"/><g class="b1"><text class="ink" x="745" y="158" style="font-size:16px" textLength="163" lengthAdjust="spacingAndGlyphs">Here's the thing:</text><path class="strike" d="M741.0,152.0 Q752.2,151.4 763.4,151.7 Q780.2,153.7 797.0,152.9 Q809.2,150.5 821.3,152.1 Q838.3,153.1 855.3,152.3 