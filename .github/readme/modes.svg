<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 596" width="640" height="596" role="img" aria-label="The three ways to use it. Check lists problems with the quoted line and a short fix. Rewrite returns the smallest edit and a Changed list. Write follows the rules while the agent writes and returns only the text."><title>The three ways to use it. Check lists problems with the quoted line and a short fix. Rewrite returns the smallest edit and a Changed list. Write follows the rules while the agent writes and returns only the text.</title><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace;font-size:18px;fill:#2a2a2a;white-space:pre}.lab{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12px;letter-spacing:.14em;fill:#8a8068}.note{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;fill:#6b6350}.pen{fill:none;stroke:#d6342b;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.num{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12px;font-weight:700;fill:#d6342b;text-anchor:middle}.ring{fill:none;stroke:#d6342b;stroke-width:1.6}.ok{fill:#1d6b3a}.foot2{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:16px;fill:#6b6350}.h{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-weight:700;font-size:21px;fill:#2a2a2a}.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:16px;fill:#4a4535}.c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace;font-size:15px;fill:#2a2a2a}@keyframes m0{0.00%{opacity:0;transform:translateY(14px)}2.86%{opacity:0;transform:translateY(14px)}7.14%{opacity:1;transform:translateY(0)}91.43%{opacity:1;transform:translateY(0)}95.71%{opacity:0;transform:translateY(0)}100.00%{opacity:0;transform:translateY(14px)}}.m0{animation:m0 14.0s linear infinite;}@keyframes m1{0.00%{opacity:0;transform:translateY(14px)}10.71%{opacity:0;transform:translateY(14px)}15.00%{opacity:1;transform:translateY(0)}91.43%{opacity:1;transform:translateY(0)}95.71%{opacity:0;transform:translateY(0)}100.00%{opacity:0;transform:translateY(14px)}}.m1{animation:m1 14.0s linear infinite;}@keyframes m2{0.00%{opacity:0;transform:translateY(14px)}18.57%{opacity:0;transform:translateY(14px)}22.86%{opacity:1;transform:translateY(0)}91.43%{opacity:1;transform:translateY(0)}95.71%{opacity:0;transform:translateY(0)}100.00%{opacity:0;transform:translateY(14px)}}.m2{animation:m2 14.0s linear infinite;}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="m0"><rect x="1" y="10" width="638" height="176" rx="12" fill="#fbf7ee" stroke="#e4dcc8" stroke-width="2"/><text class="h" x="24" y="46">Check</text><text class="s" x="140" y="46">Ask it to check a draft.</text><text class="s" x="24" y="76">Nothing is rewritten. Each finding quotes the line, names the</text><text class="s" x="24" y="98">pattern and gives a short fix.</text><rect x="24" y="114" width="592" height="38" rx="6" fill="#fffdf7" stroke="#e4dcc8"/><text class="c" x="38" y="138">“Here's the thing:” · setup before the point · cut it</text></g><g class="m1"><rect x="1" y="198" width="638" height="200" rx="12" fill="#fbf7ee" stroke="#e4dcc8" stroke-width="2"/><text class="h" x="24" y="234">Rewrite</text><text class="s" x="140" y="234">Give it a draft.</text><text class="s" x="24" y="264">The smallest edit that removes the problems, then a short Changed</text><text class="s" x="24" y="286">list. Say “paste as is” and only the text comes back.</text><rect x="24" y="302" width="592" height="62" rx="6" fill="#fffdf7" stroke="#e4dcc8"/><text class="c" x="38" y="326">Changed:</text><text class="c" x="38" y="350">- Cut “Here's the thing:” and the contrast.</text></g><g class="m2"><rect x="1" y="410" width="638" height="176" rx="12" fill="#fbf7ee" stroke="#e4dcc8" stroke-width="2"/><text class="h" x="24" y="446">Write</text><text class="s" x="140" y="446">Ask your agent to write.</text><text class="s" x="24" y="476">It follows the rules while it writes and runs the final check on its</text><text class="s" x="24" y="498">own draft. Only the text comes back.</text><rect x="24" y="514" width="592" height="38" rx="6" fill="#fffdf7" stroke="#e4dcc8"/><text class="c" x="38" y="538">Shipping fast builds trust.</text></g></svg>
