<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 376" width="1200" height="376" role="img" aria-label="The 17 patterns the skill checks for, in a grid. A scan flags four patterns together in one draft, and the skill fixes them. A second scan flags only one pattern in another draft, and the skill leaves it alone, which editors call stet."><title>The 17 patterns the skill checks for, in a grid. A scan flags four patterns together in one draft, and the skill fixes them. A second scan flags only one pattern in another draft, and the skill leaves it alone, which editors call stet.</title><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace;font-size:15px;fill:#f3ecdc;white-space:pre}.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}.dim{fill:#9a94a8}.ink{fill:#2a2a2a}.green{fill:#4fd18b}.red{fill:#d6342b}.lab{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12px;font-weight:600;letter-spacing:.16em;fill:#9a94a8}.head{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-weight:800;fill:#f3ecdc}.serif{font-family:Georgia,"Times New Roman",serif;font-style:italic;fill:#d6342b}.pen{fill:none;stroke:#d6342b;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}.strike{fill:none;stroke:#d6342b;stroke-width:2;stroke-linecap:round}.tile{fill:#23212c;stroke:#363343;stroke-width:1.5}.big{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","Courier New",monospace;font-size:54px;font-weight:700}@keyframes f0{0.00%{opacity:0}6.00%{opacity:0}7.14%{opacity:1}39.09%{opacity:1}41.82%{opacity:0}100.00%{opacity:0}}.f0{animation:f0 22.0s linear infinite;}@keyframes f1{0.00%{opacity:0}6.00%{opacity:0}7.14%{opacity:1}39.09%{opacity:1}41.82%{opacity:0}100.00%{opacity:0}}.f1{animation:f1 22.0s linear infinite;}@keyframes f2{0.00%{opacity:0}6.00%{opacity:0}7.14%{opacity:1}39.09%{opacity:1}41.82%{opacity:0}100.00%{opacity:0}}.f2{animation:f2 22.0s linear infinite;}@keyframes f6{0.00%{opacity:0}9.64%{opacity:0}10.77%{opacity:1}39.09%{opacity:1}41.82%{opacity:0}100.00%{opacity:0}}.f6{animation:f6 22.0s linear infinite;}@keyframes beam1{0.00%{opacity:0;transform:translateY(0)}3.64%{opacity:0;transform:translateY(0)}4.55%{opacity:1;transform:translateY(0)}22.73%{opacity:1;transform:translateY(250px)}24.09%{opacity:0;transform:translateY(250px)}100.00%{opacity:0}}.beam1{animation:beam1 22.0s linear infinite;}@keyframes v1{0.00%{opacity:0}3.64%{opacity:0}4.55%{opacity:1}25.00%{opacity:1}39.09%{opacity:1}41.82%{opacity:0}100.00%{opacity:0}}.v1{animation:v1 22.0s linear infinite;}@keyframes v1b{0.00%{opacity:0}25.45%{opacity:0}27.73%{opacity:1}39.09%{opacity:1}41.82%{opacity:0}100.00%{opacity:0}}.v1b{animation:v1b 22.0s linear infinite;}@keyframes f7{0.00%{opacity:0}55.09%{opacity:0}56.23%{opacity:1}84.55%{opacity:1}87.27%{opacity:0}100.00%{opacity:0}}.f7{animation:f7 22.0s linear infinite;}@keyframes beam11{0.00%{opacity:0;transform:translateY(0)}49.09%{opacity:0;transform:translateY(0)}50.00%{opacity:1;transform:translateY(0)}68.18%{opacity:1;transform:translateY(250px)}69.55%{opacity:0;transform:translateY(250px)}100.00%{opacity:0}}.beam11{animation:beam11 22.0s linear infinite;}@keyframes v11{0.00%{opacity:0}49.09%{opacity:0}50.00%{opacity:1}70.45%{opacity:1}84.55%{opacity:1}87.27%{opacity:0}100.00%{opacity:0}}.v11{animation:v11 22.0s linear infinite;}@keyframes v11b{0.00%{opacity:0}70.91%{opacity:0}73.18%{opacity:1}84.55%{opacity:1}87.27%{opacity:0}100.00%{opacity:0}}.v11b{animation:v11b 22.0s linear infinite;}@keyframes reset{0.00%{opacity:0}1.36%{opacity:1}94.55%{opacity:1}98.18%{opacity:0}100.00%{opacity:0}}.reset{animation:reset 22.0s linear infinite;}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="1" y="1" width="1198" height="374" rx="18" fill="#17161d" stroke="#363343" stroke-width="2"/><g class="reset"><text class="lab" x="42" y="46">17 PATTERNS, CHECKED IN COMBINATION</text><rect class="tile" x="42" y="104" width="270" height="40" rx="10"/><text class="dim" x="56" y="130" style="font-size:13px">01</text><text class="sans" x="86" y="130" style="font-size:14.5px" textLength="80" lengthAdjust="spacingAndGlyphs">Not X, but Y</text><rect class="tile" x="324" y="104" width="270" height="40" rx="10"/><text class="dim" x="338" y="130" style="font-size:13px">02</text><text class="sans" x="368" y="130" style="font-size:14.5px" textLength="100" lengthAdjust="spacingAndGlyphs">Groups of three</text><rect class="tile" x="606" y="104" width="270" height="40" rx="10"/><text class="dim" x="620" y="130" style="font-size:13px">03</text><text class="sans" x="650" y="130" style="font-size:14.5px" textLength="147" lengthAdjust="spacingAndGlyphs">Setup before the point</text><rect class="tile" x="888" y="104" width="270" height="40" rx="10"/><text class="dim" x="902" y="130" style="font-size:13px">04</text><text class="sans" x="932" y="130" style="font-size:14.5px" textLength="161" lengthAdjust="spacingAndGlyphs">Fake meaning on the tail</text><rect class="tile" x="42" y="154" width="270" height="40" rx="10"/><text class="dim" x="56" y="180" style="font-size:13px">05</text><text class="sans" x="86" y="180" style="font-size:14.5px" textLength="114" lengthAdjust="spacingAndGlyphs">Puffed importance</text><rect class="tile" x="324" y="154" width="270" height="40" rx="10"/><text class="dim" x="338" y="180" style="font-size:13px">06</text><text class="sans" x="368" y="180" style="font-size:14.5px" textLength="114" lengthAdjust="spacingAndGlyphs">Stacked fragments</text><rect class="tile" x="606" y="154" width="270" height="40" rx="10"/><text class="dim" x="620" y="180" style="font-size:13px">07</text><text class="sans" x="650" y="180" style="font-size:14.5px" textLength="208" lengthAdjust="spacingAndGlyphs">Closer that repeats or flatters</text><rect class="tile" x="888" y="154" width="270" height="40" rx="10"/><text class="dim" x="902" y="180" style="font-size:13px">08</text><text class="sans" x="932" y="180" style="font-size:14.5px" textLength="100" lengthAdjust="spacingAndGlyphs">Piled-up hedges</text><rect class="tile" x="42" y="204" width="270" height="40" rx="10"/><text class="dim" x="56" y="230" style="font-size:13px">09</text><text class="sans" x="86" y="230" style="font-size:14.5px" textLength="87" lengthAdjust="spacingAndGlyphs">Vague sources</text><rect class="tile" x="324" y="204" width="270" height="40" rx="10"/><text class="dim" x="338" y="230" style="font-size:13px">10</text><text class="sans" x="368" y="230" style="font-size:14.5px" textLength="114" lengthAdjust="spacingAndGlyphs">Rotating synonyms</text><rect class="tile" x="606" y="204" width="270" height="40" rx="10"/><text class="dim" x="620" y="230" style="font-size:13px">11</text><text class="sans" x="650" y="230" style="font-size:14.5px" textLength="80" lengthAdjust="spacingAndGlyphs">False ranges</text><rect class="tile" x="888" y="204" width="270" height="40" rx="10"/><text class="dim" x="902" y="230" style="font-size:13px">12</text><text class="sans" x="932" y="230" style="font-size:14.5px" textLength="141" lengthAdjust="spacingAndGlyphs">Same shape everywhere</text><rect class="tile" x="42" y="254" width="270" height="40" rx="10"/><text class="dim" x="56" y="280" style="font-size:13px">13</text><text class="sans" x="86" y="280" style="font-size:14.5px" textLength="208" lengthAdjust="spacingAndGlyphs">Challenge-then-optimism formula</text><rect class="tile" x="324" y="254" width="270" height="40" rx="10"/><text class="dim" x="338" y="280" style="font-size:13px">14</text><text class="sans" x="368" y="280" style="font-size:14.5px" textLength="201" lengthAdjust="spacingAndGlyphs">Generic where a fact should be</text><rect class="tile" x="606" y="254" width="270" height="40" rx="10"/><text class="dim" x="620" y="280" style="font-size:13px">15</text><text class="sans" x="650" y="280" style="font-size:14.5px" textLength="114" lengthAdjust="spacingAndGlyphs">Chatbot leftovers</text><rect class="tile" x="888" y="254" width="270" height="40" rx="10"/><text class="dim" x="902" y="280" style="font-size:13px">16</text><text class="sans" x="932" y="280" style="font-size:14.5px" textLength="154" lengthAdjust="spacingAndGlyphs">Sameness across a batch</text><rect class="tile" x="42" y="304" width="270" height="40" rx="10"/><text class="dim" x="56" y="330" style="font-size:13px">17</text><text class="sans" x="86" y="330" style="font-size:14.5px" textLength="168" lengthAdjust="spacingAndGlyphs">Fixes that make new tells</text><rect class="tile" x="324" y="304" width="834" height="40" rx="10" stroke-dasharray="4 6" fill="none"/><g class="f0"><rect x="42" y="104" width="270" height="40" rx="10" fill="#d6342b" fill-opacity=".16" stroke="#d6342b" stroke-width="2.5"/></g><g class="f1"><rect x="324" y="104" width="270" height="40" rx="10" fill="#d6342b" fill-opacity=".16" stroke="#d6342b" stroke-width="2.5"/></g><g class="f2"><rect x="606" y="104" width="270" height="40" rx="10" fill="#d6342b" fill-opacity=".16" stroke="#d6342b" stroke-width="2.5"/></g><g class="f6"><rect x="606" y="154" width="270" height="40" rx="10" fill="#d6342b" fill-opacity=".16" stroke="#d6342b" stroke-width="2.5"/></g><g class="beam1"><rect x="30" y="100" width="1140" height="4" rx="2" fill="#d6342b"/><rect x="30" y="70" width="1140" height="30" fill="url(#bg1)" /></g><defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6342b" stop-opacity="0"/><stop offset="1" stop-color="#d6342b" stop-opacity=".28"/></linearGradient></defs><text class="lab v1" x="342" y="330">DRAFT A</text><text class="head red v1b" x="434" y="333" style="font-size:22px" textLength="232" lengthAdjust="spacingAndGlyphs">4 together: fix them</text><g class="f7"><rect x="888" y="154" width="270" height="40" rx="10" fill="#4fd18b" fill-opacity=".16" stroke="#4fd18b" stroke-width="2.5"/></g><g class="beam11"><rect x="30" y="100" width="1140" height="4" rx="2" fill="#4fd18b"/><rect x="30" y="70" width="1140" height="30" fill="url(#bg11)" /></g><defs><linearGradient id="bg11" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fd18b" stop-opacity="0"/><stop offset="1" stop-color="#4fd18b" stop-opacity=".28"/></linearGradient></defs><text class="lab v11" x="342" y="330">DRAFT B</text><text class="head green v11b" x="434" y="333" style="font-size:22px" textLength="313" lengthAdjust="spacingAndGlyphs">1 alone: stet, let it stand</text></g></svg>
